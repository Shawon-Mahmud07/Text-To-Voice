<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Text to Voice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="dark-mode">
  <div class="app-wrapper">

    <!-- Header -->
    <header class="main-header">
      <div class="logo">Text-to-<span>Voice</span></div>

      <button id="themeToggle" class="theme-btn" title="Toggle theme">
        <i class="fas fa-sun sun-icon"></i>
        <i class="fas fa-moon moon-icon"></i>
      </button>
    </header>

    <p class="subtitle">
      Convert text into natural speech (Any Language)
    </p>

    <main class="content-area">

      <!-- Text Input -->
      <div class="input-container">
        <textarea id="textInput" placeholder="Type here (English, বাংলা, हिन्दी, العربية, 中文...)"></textarea>

        <div id="highlightOverlay" class="highlight-overlay"></div>
      </div>

      <!-- Voice Settings -->
      <div class="voice-settings">

        <div class="field">
          <label>Voice</label>
          <select id="voiceSelect"></select>
        </div>

        <div class="field">
          <label>Gender</label>
          <select id="genderSelect">
            <option value="all">All</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>

        <div class="field">
          <label>Speed: <span id="rateValue">1</span></label>
          <input type="range" id="rateControl" min="0.5" max="2" step="0.1" value="1">
        </div>

        <div class="field">
          <label>Pitch: <span id="pitchValue">1</span></label>
          <input type="range" id="pitchControl" min="0" max="2" step="0.1" value="1">
        </div>

      </div>

      <!-- Buttons -->
      <div class="control-panel">
        <button id="speakBtn" class="action-btn primary">
          <i class="fas fa-play"></i> Speak
        </button>

        <button id="stopBtn" class="action-btn danger" disabled>
          <i class="fas fa-stop"></i> Stop
        </button>

        <button id="clearBtn" class="action-btn secondary">
          <i class="fas fa-trash"></i> Clear
        </button>
      </div>

    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
